<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Departmental Lab Administration - Poster Printing</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --accent-main: #0284c7; /* deep vibrant blue */
    --accent-teal: #0d9488;
    --accent-gold: #ea580c;
    --accent-red: #e11d48;
    --card-bg: #ffffff;
    --card-border: rgba(15, 23, 42, 0.08);
    --bg-color: #ffffff;
    --font-head: 'Outfit', sans-serif;
    --font-body: 'Inter', sans-serif;
    --pad: 12mm;
    --gap: 8mm;
  }
  @page { size: 914.4mm 609.6mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html { font-family: var(--font-body); color: var(--text-primary); -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #e2e8f0; }
  
  /* Strictly white background as requested */
  body {
    width: 914.4mm; height: 609.6mm; overflow: hidden; transform-origin: top left;
    background: #ffffff; position: relative;
  }
  
  #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
  
  /* Top Navigation */
  .navbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6mm var(--pad); background: rgba(255,255,255,0.9);
    border-bottom: 1px solid var(--card-border);
  }
  .nav-logo { display: flex; align-items: center; gap: 4mm; }
  .nav-logo svg { width: 10mm; height: 10mm; }
  .nav-logo-text { font-family: var(--font-head); font-size: 14pt; font-weight: 800; color: var(--text-primary); letter-spacing: 1px; }
  
  .nav-links { display: flex; gap: 6mm; align-items: center; }
  .nav-link { 
    font-size: 11pt; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .nav-link.active { color: var(--accent-main); }
  
  /* Main Layout Grid */
  .main-content {
    flex: 1; min-height: 0; padding: 8mm var(--pad);
    display: grid; grid-template-columns: 1fr 1.3fr 1fr; grid-template-rows: auto 1fr;
    gap: var(--gap);
  }
  
  /* Hero Section spans full width */
  .hero-section {
    grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
    border: 1px solid var(--card-border); border-radius: 6mm; padding: 10mm 15mm;
    box-shadow: 0 10px 40px rgba(0,0,0,0.03);
    position: relative; overflow: hidden;
  }
  .hero-text { flex: 1; z-index: 2; max-width: 60%; }
  .hero-text h1 { font-family: var(--font-head); font-size: 38pt; font-weight: 900; line-height: 1.1; margin-bottom: 4mm; letter-spacing: -1px; }
  .hero-text h1 span { color: transparent; background: linear-gradient(90deg, var(--accent-main), var(--accent-teal)); -webkit-background-clip: text; background-clip: text; }
  .hero-text p { font-size: 15pt; color: var(--text-secondary); line-height: 1.5; font-weight: 500; }
  
  .hero-graphic {
    position: absolute; right: -50px; top: -50px; width: 45%; height: 150%;
    z-index: 1; opacity: 0.9;
    background-image: url('assets/abstract.png');
    background-size: contain; background-position: center right; background-repeat: no-repeat;
  }
  
  /* Bento Box Cards */
  .bento-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 6mm; padding: 8mm; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    display: flex; flex-direction: column; position: relative; overflow-y: auto;
    transition: transform 0.2s;
  }
  
  /* Special column styling */
  .col-1 { grid-column: 1; display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  .col-2 { grid-column: 2; display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  .col-3 { grid-column: 3; display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  
  /* Top Tags for visual flair */
  .tag {
    align-self: flex-start; padding: 1.5mm 4mm; border-radius: 100px;
    font-size: 9pt; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 3mm;
  }
  .tag.blue { background: #e0f2fe; color: #0369a1; }
  .tag.red { background: #ffe4e6; color: #be123c; }
  .tag.teal { background: #ccfbf1; color: #0f766e; }
  .tag.gold { background: #ffedd5; color: #c2410c; }
  
  /* Typography inside cards */
  .bento-card h2 { font-family: var(--font-head); font-size: 18pt; font-weight: 800; margin-bottom: 4mm; letter-spacing: -0.5px; }
  .bento-card h3 { font-family: var(--font-head); font-size: 14pt; font-weight: 700; margin: 4mm 0 2mm 0; }
  .bento-card p, .bento-card li { font-size: 11.5pt; line-height: 1.5; color: var(--text-secondary); margin-bottom: 2.5mm; }
  .bento-card p.small { font-size: 10.5pt; }
  .bento-card ul { padding-left: 6mm; margin-bottom: 3mm; }
  .bento-card li { margin-bottom: 1.5mm; }
  .bento-card li::marker { color: var(--accent-main); }
  .bento-card strong { color: var(--text-primary); font-weight: 700; }
  
  .img-box {
    width: 100%; height: 60mm; border-radius: 4mm; overflow: hidden; margin-top: auto;
    background-image: url('assets/plotter.png'); background-size: cover; background-position: center;
    border: 1px solid var(--card-border);
  }
  
  /* Emphasized Notice Box */
  .notice-box {
    background: #f8fafc; border-left: 4px solid var(--accent-main);
    padding: 3mm 4mm; border-radius: 0 3mm 3mm 0; margin: 2mm 0;
  }
  .notice-box p { margin: 0; color: #334155; font-weight: 600; font-size: 11pt; }
  .notice-box.red-box { border-left-color: var(--accent-red); background: #fff1f2; }
  .notice-box.red-box p { color: #9f1239; }
  
  /* Footer */
  .footer {
    padding: 6mm var(--pad); border-top: 1px solid var(--card-border);
    background: #ffffff; display: flex; justify-content: space-between; align-items: center;
  }
  .footer-left { display: flex; flex-direction: column; gap: 1mm; }
  .footer-left strong { font-family: var(--font-head); font-size: 13pt; color: var(--text-primary); }
  .footer-left p { font-size: 10pt; color: var(--text-secondary); }
  .footer-links { display: flex; gap: 4mm; font-weight: 600; font-size: 11pt; color: var(--accent-main); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function PosterApp() {
  useEffect(() => {
    const fit = () => {
      if(window.matchMedia('print').matches) return;
      const pW = 914.4 * 3.7795, pH = 609.6 * 3.7795;
      const scale = Math.min(window.innerWidth / pW, window.innerHeight / pH);
      document.body.style.transform = `translate(${(window.innerWidth - pW * scale) / 2}px, ${(window.innerHeight - pH * scale) / 2}px) scale(${scale})`;
    };
    fit(); window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  return (
    <>
      <nav className="navbar">
        <div className="nav-logo">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="15" width="70" height="70" rx="20" fill="#0f172a"/>
            <path d="M35 45 L50 30 L65 45 L65 70 L35 70 Z" fill="#0284c7"/>
            <circle cx="50" cy="55" r="8" fill="#ffffff"/>
          </svg>
          <div className="nav-logo-text">USF FACILITIES</div>
        </div>
        <div className="nav-links">
          <div className="nav-link">Home</div>
          <div className="nav-link">FAQ</div>
          <div className="nav-link">About</div>
          <div className="nav-link">Staff</div>
          <div className="nav-link">Services</div>
          <div className="nav-link">Contact</div>
          <div className="nav-link active">Poster Printing</div>
        </div>
      </nav>

      <div className="main-content">
        
        {/* HERO SPANNING ALL COLUMNS */}
        <div className="hero-section">
          <div className="hero-text">
            <h1>Departmental Lab<br/><span>Administration</span></h1>
            <p>The poster printing facility is operated by the College of Engineering's Technical Support Services (TSS) group. All posters are to be submitted electronically via this website.</p>
          </div>
          <div className="hero-graphic"></div>
        </div>

        {/* COL 1 */}
        <div className="col-1">
          <div className="bento-card" style={{flex: 1.2}}>
            <div className="tag blue">Eligibility</div>
            <h2>Approved Purposes</h2>
            <p>Poster printing is available <strong>free of charge</strong> for College of Engineering (COE) faculty, staff and students for the following approved purposes:</p>
            <ul>
              <li>Internal and external research-related events (open-houses, symposia, conferences, etc.)</li>
              <li>COE-REU symposia</li>
              <li>Other selected activities that are research-oriented</li>
              <li>COE student societies events (limited to one or two posters per event)</li>
              <li>Senior capstone design course special events</li>
            </ul>
            <div className="notice-box">
              <p>Printing specifically related to general coursework is not allowed through the free college service.</p>
            </div>
            <p>When a poster is submitted for printing, a <strong>faculty contact name</strong> must be provided.</p>
          </div>

          <div className="bento-card" style={{flex: 1}}>
            <div className="tag gold">Specs</div>
            <h2>Dimensions & Pick-up</h2>
            <p>Printing is available in widths of <strong>24 inches, 36 inches or 42 inches</strong> and variable length.</p>
            <ul>
              <li>For posters 42 inches in width, maximum printed length should not exceed 56".</li>
              <li>For posters 24 or 36 inches in width, maximum printed length should not exceed 60 inches.</li>
            </ul>
            <p>Finished posters will be available for pick-up outside <strong>ENB 110 - DFX Lab</strong>.</p>
          </div>
        </div>

        {/* COL 2 (Center, Wider) */}
        <div className="col-2">
          <div className="bento-card" style={{flex: 1, borderTop: '4px solid var(--accent-red)'}}>
            <div className="tag red">Critical</div>
            <h2>Requirements (NO Exceptions)</h2>
            <ul>
              <li><strong>SAME DAY submissions will NOT be accepted, NO exceptions.</strong></li>
              <li>Only ONE (1) copy of the poster will be printed.</li>
              <li>Posters must be submitted in <strong>PDF format</strong>. Visit the <em>How to convert poster to PDF</em> page for instructions.</li>
              <li>Posters must be to scale as no resizing of posters will be done by the printing staff.</li>
              <li>Only final posters will be accepted. Draft copies will not be accepted.</li>
              <li>Posters must have a <strong>predominately white background</strong>. Solid backgrounds that cover the whole poster will not be permitted. For examples, view posters that are hung up in the second and third floor hallways of ENB.</li>
              <li>One of the poster dimensions must be 24, 36 or 42 inches (plotter paper comes only in these sizes) or trimming will have to be done by the individual or an offsite location for non standard paper sizes at their own expense.</li>
              <li>Posters will generally be ready within <strong>24 business hours</strong> of submission. However, please allow at least 48 business hours (or more if a large COE research event is coming up) for poster printing.</li>
              <li>Poster printing is not done during the weekends or official USF holidays.</li>
              <li>Poster printouts will not be done on the actual day of the event that corresponds to the poster.</li>
              <li>The individual will be notified via email upon completion of poster printing.</li>
            </ul>
          </div>
          
          <div style={{display: 'flex', gap: 'var(--gap)', minHeight: 0, flex: 0.5}}>
            <div className="bento-card" style={{flex: 1}}>
                <div className="tag teal">Format</div>
                <h2>Why PDF?</h2>
                <p className="small">ENG TSS requires all posters submitted by in PDF format because posters printed from PDF files will print <strong>EXACTLY</strong> as seen in the PDF file, unlike Powerpoint files which may change formatting. PDFs are also smaller in file size.</p>
            </div>
            <div className="bento-card" style={{flex: 1, padding: '0'}}>
                <div className="img-box" style={{height: '100%', margin: 0, border: 'none', borderRadius: '6mm'}}></div>
            </div>
          </div>
        </div>

        {/* COL 3 */}
        <div className="col-3">
          <div className="bento-card" style={{flex: 1.5}}>
            <div className="tag teal">Design Guide</div>
            <h2>How to create/design a poster</h2>
            <h3>How to convert poster to PDF</h3>
            <p className="small">Typically a poster is composed of a title, introduction, overview of experimental approach, results, discussion of results, reference articles, and credits. All capable of being read in under 10 minutes.</p>
            <p className="small">When creating your poster <strong>Microsoft PowerPoint</strong> is recommended as the source software. Other poster creation software such as "OpenOffice" and "PosterGenius" are also available. Just be sure you have a means to convert the poster to Adobe PDF format.</p>
            
            <p className="small">Before the actual design of the poster begins be sure you know what size your poster should be. Also find out how the poster will be supported for public viewing, e.g., attached to solid foam poster board resting on an easel or attached to a wall. Also consider how the poster will be transported to the conference site if travel by airplane is needed. Typically if travel is needed the poster should be inserted inside a solid cardboard tubing for protection.</p>

            <p className="small">Photo paper produces the best appearance for a poster. The Technical Support Services group at USF uses glossy photo paper that has widths of 24", 36" and 42". If a conference requires a side of the poster to be other than one of the previously mentions widths, TSS will print the poster on a page that fits the required size but you will have to trim the excess paper from the poster borders.</p>

            <p className="small">Having carefully determined the size of your poster you may set those dimensions in your poster creation software (in this example PowerPoint is set to 36" x 24" landscape). Adhere to the aforementioned poster Design Guidelines on the main poster submission page.</p>

            <div className="notice-box">
              <p>In Office 2007/2010, set the "Poster Size" by clicking on the Design Tab, then click on "Page Setup".</p>
            </div>
            <div className="notice-box">
              <p>Please email your poster to eng-tss@usf.edu..</p>
            </div>
          </div>
          
          <div className="bento-card" style={{flex: 0.5}}>
            <div className="tag red">Emergency</div>
            <h2>Last Minute Printing</h2>
            <p className="small">If you need printing in a shorter time than 48 hours or specials services like extrememly large dimensions or lamination, the <strong>Ricoh USF Print Shop</strong> is a great solution.</p>
            <p className="small" style={{marginTop: '2mm'}}><strong>Need Help?</strong> Contact us by submitting a ticket, emailing eng-tss@usf.edu or calling 813-974-4889.</p>
          </div>
        </div>
      </div>

      <footer className="footer">
        <div className="footer-left">
          <strong>USF College of Engineering</strong>
          <p>Copyright &copy; 2023, University of South Florida. All rights reserved.<br/>4202 E. Fowler Avenue, Tampa, FL 33620, USA &bull; 813-974-2011</p>
        </div>
        <div className="footer-links">
          <span>Services</span> &bull; 
          <span>Departmental Labs</span> &bull; 
          <span>Research Support Services</span> &bull; 
          <span>Poster Printing</span> &bull; 
          <span>3D Printing</span> &bull; 
          <span>Tech Support</span>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PosterApp />);
</script>
</body>
</html>
