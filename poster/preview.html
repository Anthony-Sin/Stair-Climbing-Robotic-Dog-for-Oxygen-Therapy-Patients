<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Preview Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #555;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 12px;
    font-family: Arial, sans-serif;
  }
  .toolbar {
    background: #333;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .toolbar button {
    background: #006747;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .toolbar button:hover { background: #004d35; }
  .stage {
    overflow: auto;
    background: #333;
    padding: 10px;
    border-radius: 6px;
    max-width: 100vw;
    max-height: 85vh;
  }
  .frame-wrap {
    transform-origin: top left;
    display: inline-block;
  }
  iframe {
    display: block;
    width: 3456px;
    height: 2304px;
    border: none;
    background: #fff;
  }
</style>
</head>
<body>
<div class="toolbar">
  <span><b>Poster Preview</b> — 36″ × 24″ (3456 × 2304 px)</span>
  <button onclick="setScale(0.25)">25%</button>
  <button onclick="setScale(0.33)">33%</button>
  <button onclick="setScale(0.50)">50%</button>
  <button onclick="setScale(1.0)">100%</button>
  <button onclick="window.open('poster_print.html','_blank')">Open Full Poster</button>
</div>
<div class="stage" id="stage">
  <div class="frame-wrap" id="frameWrap">
    <iframe id="posterFrame" src="poster_print.html"></iframe>
  </div>
</div>
<script>
  function setScale(s) {
    const fw = document.getElementById('frameWrap');
    fw.style.transform = `scale(${s})`;
    fw.style.width = (3456 * s) + 'px';
    fw.style.height = (2304 * s) + 'px';
  }
  setScale(0.25);
</script>
</body>
</html>
