<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>State Machines</title>
<style>
  body { margin: 0; padding: 20px; font-family: system-ui, -apple-system, sans-serif; background: #f8f8f6; }
  svg text { font-family: system-ui, -apple-system, sans-serif; }
  h1 { font-size: 15px; font-weight: 500; color: #555; margin: 0 0 12px; }
</style>
</head>
<body>
<h1>Policy handoff &amp; climb state machines — live PGTT walk → blind-RL climb</h1>
<svg width="100%" viewBox="0 0 860 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid filled-triangle arrowheads, one explicit colour per flow, no context-stroke. -->
  <defs>
    <marker id="pr" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="11.5" refY="6.5" orient="auto">
      <path d="M2 2 L11.5 6.5 L2 11 Z" fill="#534AB7"/>
    </marker>
    <marker id="gn" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="11.5" refY="6.5" orient="auto">
      <path d="M2 2 L11.5 6.5 L2 11 Z" fill="#0F6E56"/>
    </marker>
    <marker id="or" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="11.5" refY="6.5" orient="auto">
      <path d="M2 2 L11.5 6.5 L2 11 Z" fill="#D85A30"/>
    </marker>
    <marker id="am" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="11.5" refY="6.5" orient="auto">
      <path d="M2 2 L11.5 6.5 L2 11 Z" fill="#BA7517"/>
    </marker>
    <marker id="gy" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="11.5" refY="6.5" orient="auto">
      <path d="M2 2 L11.5 6.5 L2 11 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- ══════════ LEFT: HandoffController  x=20..410 ══════════ -->
  <rect x="20" y="20" width="390" height="500" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="215" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">HandoffController — Isaac Sim · 50 Hz</text>

  <!-- Main flow (center x=200) -->
  <rect x="100" y="62" width="200" height="54" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
  <text x="200" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">WALK</text>
  <text x="200" y="102" text-anchor="middle" font-size="11" fill="#534AB7">PGTT MLP · heightmap walk</text>

  <rect x="100" y="178" width="200" height="54" rx="8" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.5"/>
  <text x="200" y="199" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">CLIMB</text>
  <text x="200" y="218" text-anchor="middle" font-size="11" fill="#3C3489">blind-RL · proprioceptive climb</text>

  <rect x="100" y="296" width="200" height="54" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="200" y="317" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">TOP EGRESS</text>
  <text x="200" y="336" text-anchor="middle" font-size="11" fill="#534AB7">Walk clear of stair crest</text>

  <!-- ABORT — beside CLIMB (right), so the left gutter stays clear for the return lane -->
  <rect x="312" y="180" width="82" height="50" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="0.5"/>
  <text x="353" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#444">ABORT</text>
  <text x="353" y="217" text-anchor="middle" font-size="9.5" fill="#888">timeout / tilt</text>

  <!-- WALK → CLIMB -->
  <line x1="200" y1="116" x2="200" y2="176" stroke="#534AB7" stroke-width="1.6" marker-end="url(#pr)"/>
  <text x="210" y="150" font-size="10" fill="#888">stall + riser ≥2</text>

  <!-- CLIMB → TOP EGRESS -->
  <line x1="200" y1="232" x2="200" y2="294" stroke="#534AB7" stroke-width="1.6" marker-end="url(#pr)"/>
  <text x="210" y="266" font-size="10" fill="#888">crest clear</text>

  <!-- CLIMB → ABORT (label carried by the ABORT box itself) -->
  <line x1="300" y1="205" x2="312" y2="205" stroke="#D85A30" stroke-width="1.4" marker-end="url(#or)"/>

  <!-- ABORT → WALK (reset): up and into WALK's right edge -->
  <path d="M353 180 L353 89 L300 89" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#pr)"/>
  <text x="309" y="83" font-size="10" fill="#888">reset → walk</text>

  <!-- TOP EGRESS → WALK (walk resumed): far-left return lane, clear of everything -->
  <path d="M100 323 L62 323 L62 89 L100 89" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#pr)"/>
  <text x="52" y="210" font-size="10" fill="#888" transform="rotate(-90 52 210)">walk resumed</text>

  <!-- ══════════ RIGHT: ClimbFSM  x=450..840 ══════════ -->
  <rect x="450" y="20" width="390" height="500" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="645" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">ClimbFSM — Docker · climb_fsm.py</text>

  <!-- Main flow (center x=595) -->
  <rect x="500" y="62" width="190" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="595" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">FLAT FOLLOW</text>
  <text x="595" y="102" text-anchor="middle" font-size="11" fill="#085041">Normal tracking</text>

  <rect x="500" y="150" width="190" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="595" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">STAIR APPROACH</text>
  <text x="595" y="190" text-anchor="middle" font-size="11" fill="#085041">Slowing · aligning</text>

  <rect x="500" y="240" width="190" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="595" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">STAIR NEAR</text>
  <text x="595" y="280" text-anchor="middle" font-size="11" fill="#085041">Handoff pending</text>

  <rect x="500" y="330" width="190" height="52" rx="8" fill="#5DCAA5" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="595" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">COMMITTED CLIMB</text>
  <text x="595" y="370" text-anchor="middle" font-size="11" fill="#04342C">Handoff active · blind-RL</text>

  <!-- LOSS OF FLOOR -->
  <rect x="712" y="238" width="118" height="52" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="771" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#412402">LOSS OF FLOOR</text>
  <text x="771" y="278" text-anchor="middle" font-size="11" fill="#633806">Recovery</text>

  <!-- STOP -->
  <rect x="712" y="418" width="118" height="52" rx="8" fill="#E8E8E4" stroke="#888" stroke-width="0.5"/>
  <text x="771" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#444">STOP</text>
  <text x="771" y="458" text-anchor="middle" font-size="11" fill="#888">Await reacquire</text>

  <!-- Forward flow -->
  <line x1="595" y1="114" x2="595" y2="148" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#gn)"/>
  <text x="605" y="135" font-size="10" fill="#888">stairs detected</text>

  <line x1="595" y1="202" x2="595" y2="238" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#gn)"/>
  <text x="605" y="224" font-size="10" fill="#888">range close</text>

  <line x1="595" y1="292" x2="595" y2="328" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#gn)"/>
  <text x="605" y="314" font-size="10" fill="#888">handoff active</text>

  <!-- Returns to FLAT FOLLOW: one lane (x=472) shared by CLIMB-complete and STAIR-lost -->
  <path d="M500 356 L472 356 L472 88 L500 88" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#gn)"/>
  <path d="M500 176 L472 176" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="486" y="172" font-size="10" fill="#0F6E56" transform="rotate(-90 486 172)">stairs lost</text>
  <text x="486" y="312" font-size="10" fill="#0F6E56" transform="rotate(-90 486 312)">climb complete</text>

  <!-- STOP → FLAT FOLLOW: far-left lane (x=458), bottom run -->
  <path d="M712 444 L458 444 L458 100 L500 100" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#gn)"/>
  <text x="572" y="438" text-anchor="middle" font-size="10" fill="#0F6E56">person reacquired → flat follow</text>

  <!-- STAIR NEAR → LOSS OF FLOOR -->
  <path d="M690 264 L712 264" fill="none" stroke="#BA7517" stroke-width="1.4" marker-end="url(#am)"/>

  <!-- COMMITTED CLIMB → LOSS OF FLOOR -->
  <path d="M690 356 L762 356 L762 292" fill="none" stroke="#BA7517" stroke-width="1.4" marker-end="url(#am)"/>
  <text x="700" y="349" font-size="10" fill="#BA7517">stairs gone</text>

  <!-- LOSS OF FLOOR → COMMITTED CLIMB (reacquired): corridor lane, label omitted (self-evident) -->
  <path d="M712 252 L701 252 L701 344 L690 344" fill="none" stroke="#0F6E56" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#gn)"/>

  <!-- LOSS OF FLOOR → STOP -->
  <line x1="785" y1="290" x2="785" y2="416" stroke="#888" stroke-width="1.3" marker-end="url(#gy)"/>
  <text x="791" y="358" font-size="10" fill="#888">timeout</text>

  <!-- FLAT FOLLOW → LOSS OF FLOOR (person lost) -->
  <path d="M690 86 L800 86 L800 238" fill="none" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#am)"/>
  <text x="745" y="79" text-anchor="middle" font-size="10" fill="#BA7517">person lost</text>
</svg>
</body>
</html>
