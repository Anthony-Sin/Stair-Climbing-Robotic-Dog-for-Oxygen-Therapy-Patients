<svg width="100%" viewBox="0 0 860 530" xmlns="http://www.w3.org/2000/svg">

  <rect x="40" y="120" width="230" height="52" rx="6" fill="#D3D1C7" stroke="#888" stroke-width="0.5"/>

  <rect x="40" y="312" width="230" height="52" rx="6" fill="#D3D1C7" stroke="#888" stroke-width="0.5"/>

  <rect x="330" y="268" width="210" height="34" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="435" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">foot_planting</text>

  <rect x="610" y="330" width="210" height="52" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>

  <path d="M715 182 L715 210 L735 210 L735 248" fill="none" stroke="#854F0B" stroke-width="1.3" marker-end="url(#bn)"/>

  <text x="282" y="280" font-size="10" fill="#888" transform="rotate(-90 282 280)">drives</text>

  <!-- Physics loop → Benchmarking archive -->
  <path d="M270 424 L560 424 L560 286 L610 286" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#gy)"/>
  <text x="408" y="418" font-size="10" fill="#888">records each run</text>
