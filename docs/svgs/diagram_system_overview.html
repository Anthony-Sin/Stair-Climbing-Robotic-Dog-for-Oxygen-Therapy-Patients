  <text x="88" y="354" text-anchor="middle" font-size="10" fill="#888">→ Docker</text>
  <text x="88" y="380" text-anchor="middle" font-size="10" fill="#aaa">RGB + Depth</text>

  <text x="202" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#534AB7">UDP :55001</text>

  </g>
  <g class="node">
    <rect x="330" y="118" width="210" height="46" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>

  <g class="node">

    <text x="720" y="109" text-anchor="middle" font-size="11" fill="#712B13">Default walk · 153-D heightmap</text>
    <text x="720" y="123" text-anchor="middle" font-size="10" fill="#993C1D">--locomotion-policy pgtt</text>

  <!-- handoff arrow down (label offset to the right of the line, not on it) -->
  <line x1="720" y1="126" x2="720" y2="168" stroke="#993C1D" stroke-width="1.5" marker-end="url(#pr)"/>

    <text x="720" y="221" text-anchor="middle" font-size="10" fill="#993C1D">--handoff-climb-backend blind_rl</text>

  <line x1="720" y1="224" x2="720" y2="262" stroke="#993C1D" stroke-width="1.5" marker-end="url(#pr)"/>
  <text x="730" y="247" font-size="10" fill="#712B13">joint targets · 12 DOF</text>

  <text x="720" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Go2 robot</text>
  <text x="720" y="318" text-anchor="middle" font-size="10.5" fill="#993C1D">↩ blind-RL hands back to PGTT after top egress</text>

  <path d="M492 390 L492 430 L202 430 L202 390" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#gc)"/>

       crosses a Docker box. Label omitted (the legend describes this flow). -->
  <path d="M250 201 L290 201 L290 110 L584 110 L584 99 L618 99" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#pr)"/>

  <!-- ── LEGEND  y=450 ── -->
  <rect x="20" y="450" width="820" height="90" rx="8" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="472" font-size="12" font-weight="600" fill="#333">Legend</text>

  <line x1="40" y1="495" x2="100" y2="495" stroke="#888" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#gy)"/>
  <text x="112" y="499" font-size="11" fill="#555">Camera + depth frames (UDP :55002, Isaac → Docker)</text>

  <line x1="40" y1="520" x2="100" y2="520" stroke="#1D9E75" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#gc)"/>
  <text x="112" y="524" font-size="11" fill="#555">Velocity + yaw commands (UDP :55001, Docker → Isaac)</text>

  <line x1="430" y1="495" x2="490" y2="495" stroke="#534AB7" stroke-width="1.6" marker-end="url(#pr)"/>
  <text x="502" y="499" font-size="11" fill="#555">Policy select + handoff (PGTT walk ⇄ blind-RL climb)</text>
