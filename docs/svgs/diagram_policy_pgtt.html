<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PGTT walk policy</title>
<style>
  body { margin: 0; padding: 20px; font-family: system-ui, -apple-system, sans-serif; background: #f8f8f6; }
  svg text { font-family: system-ui, -apple-system, sans-serif; }
  h1 { font-size: 15px; font-weight: 500; color: #555; margin: 0 0 12px; }
</style>
</head>
<body>
<h1>PGTT walk policy — phase-guided heightmap MLP · how it works &amp; was built</h1>
<svg width="100%" viewBox="0 0 860 570" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bl" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="11.5" refY="6.5" orient="auto">
      <path d="M2 2 L11.5 6.5 L2 11 Z" fill="#185FA5"/>
    </marker>
    <marker id="pr" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="11.5" refY="6.5" orient="auto">
      <path d="M2 2 L11.5 6.5 L2 11 Z" fill="#534AB7"/>
    </marker>
    <marker id="gn" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="11.5" refY="6.5" orient="auto">
      <path d="M2 2 L11.5 6.5 L2 11 Z" fill="#0F6E56"/>
    </marker>
    <pattern id="hg" width="14" height="10" patternUnits="userSpaceOnUse">
      <path d="M14 0 L0 0 0 10" fill="none" stroke="#9bbfe0" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- ════ OBSERVATION (153-D) ════ -->
  <rect x="20" y="24" width="290" height="400" rx="12" fill="#EAF3FC" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="165" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">Observation · 153-D (raw input vector)</text>

  <g font-size="11">
    <rect x="32" y="56" width="274" height="26" rx="5" fill="#DCEBFB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="42" y="73"><tspan font-weight="700" fill="#042C53">gyro (3)</tspan><tspan fill="#185FA5"> — base angular velocity</tspan></text>
    <rect x="32" y="86" width="274" height="26" rx="5" fill="#DCEBFB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="42" y="103"><tspan font-weight="700" fill="#042C53">projected gravity (3)</tspan><tspan fill="#185FA5"> — tilt, body frame</tspan></text>
    <rect x="32" y="116" width="274" height="26" rx="5" fill="#DCEBFB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="42" y="133"><tspan font-weight="700" fill="#042C53">joint pos − default (12)</tspan><tspan fill="#185FA5"> — leg angles</tspan></text>
    <rect x="32" y="146" width="274" height="26" rx="5" fill="#DCEBFB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="42" y="163"><tspan font-weight="700" fill="#042C53">joint vel (12)</tspan><tspan fill="#185FA5"> — leg joint speeds</tspan></text>
    <rect x="32" y="176" width="274" height="26" rx="5" fill="#DCEBFB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="42" y="193"><tspan font-weight="700" fill="#042C53">gait phase (8)</tspan><tspan fill="#185FA5"> — cos/sin trot clock [0,π,π,0]</tspan></text>
    <rect x="32" y="206" width="274" height="26" rx="5" fill="#CFE6FA" stroke="#185FA5" stroke-width="1"/>
    <text x="42" y="223"><tspan font-weight="700" fill="#042C53">heightscan (99)</tspan><tspan fill="#185FA5"> — 11×9 terrain grid  ▸</tspan></text>
    <rect x="32" y="236" width="274" height="26" rx="5" fill="#DCEBFB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="42" y="253"><tspan font-weight="700" fill="#042C53">gait freq (1)</tspan><tspan fill="#185FA5"> — 2 Hz</tspan></text>
    <rect x="32" y="266" width="274" height="26" rx="5" fill="#DCEBFB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="42" y="283"><tspan font-weight="700" fill="#042C53">last action (12)</tspan><tspan fill="#185FA5"> — previous output</tspan></text>
    <rect x="32" y="296" width="274" height="26" rx="5" fill="#DCEBFB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="42" y="313"><tspan font-weight="700" fill="#042C53">command (3)</tspan><tspan fill="#185FA5"> — vx, vy, yaw</tspan></text>
  </g>

  <rect x="32" y="334" width="274" height="32" rx="6" fill="#185FA5" stroke="#042C53" stroke-width="0.5"/>
  <text x="169" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">concatenate → 153-D vector</text>
  <text x="167" y="388" text-anchor="middle" font-size="10" fill="#5887b3">raw — the MLP normalizes internally (μ / σ baked in)</text>

  <!-- ════ NETWORK + ACTION + DRIVE pipeline ════ -->
  <rect x="400" y="40" width="250" height="104" rx="10" fill="#E7E5FB" stroke="#534AB7" stroke-width="1"/>
  <text x="525" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Actor MLP</text>
  <text x="525" y="84" text-anchor="middle" font-size="11" fill="#534AB7">input normalizer (μ / σ)</text>
  <text x="525" y="104" text-anchor="middle" font-size="11" fill="#534AB7">SiLU hidden layers · feed-forward</text>
  <text x="525" y="124" text-anchor="middle" font-size="11" fill="#534AB7">no CNN · no recurrence</text>

  <line x1="525" y1="144" x2="525" y2="176" stroke="#534AB7" stroke-width="1.6" marker-end="url(#pr)"/>
  <text x="533" y="165" font-size="10" fill="#534AB7">loc → tanh · 12 deltas</text>

  <rect x="400" y="178" width="250" height="64" rx="10" fill="#DEF3EB" stroke="#0F6E56" stroke-width="1"/>
  <text x="525" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Action (12 joints)</text>
  <text x="525" y="222" text-anchor="middle" font-size="11" fill="#0F6E56">target = default_pose + 0.5 × action</text>

  <line x1="525" y1="242" x2="525" y2="274" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#gn)"/>
  <text x="533" y="263" font-size="10" fill="#0F6E56">position targets</text>

  <rect x="400" y="276" width="250" height="88" rx="10" fill="#DEF3EB" stroke="#0F6E56" stroke-width="1"/>
  <text x="525" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">PD position drive</text>
  <text x="525" y="322" text-anchor="middle" font-size="11" fill="#0F6E56">Kp 40 · Kd 0.5 · 50 Hz</text>
  <text x="525" y="344" text-anchor="middle" font-size="11" fill="#0F6E56">12 targets → Unitree Go2</text>

  <!-- OBS → MLP (routed up the gutter, never crosses a box) -->
  <path d="M310 350 L357 350 L357 92 L400 92" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#pr)"/>
  <text x="362" y="200" font-size="10" fill="#534AB7" transform="rotate(-90 362 200)">153-D obs</text>

  <!-- ════ Heightscan illustration ════ -->
  <rect x="672" y="40" width="168" height="190" rx="10" fill="#EAF3FC" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="756" y="60" text-anchor="middle" font-size="11.5" font-weight="600" fill="#042C53">heightscan (99) = 11×9 grid</text>
  <text x="756" y="76" text-anchor="middle" font-size="10" fill="#185FA5">fwd +0.5 m</text>
  <rect x="693" y="82" width="126" height="110" fill="url(#hg)" stroke="#185FA5" stroke-width="1"/>
  <circle cx="756" cy="137" r="4" fill="#D85A30"/>
  <text x="756" y="206" text-anchor="middle" font-size="10" fill="#185FA5">rear −0.5 m · lat ±0.4 m · 0.1 m cells</text>
  <text x="756" y="221" text-anchor="middle" font-size="10" fill="#5887b3">body-frame, yaw-rotated</text>

  <!-- ════ BUILD / TRAINING ════ -->
  <rect x="20" y="444" width="820" height="112" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="32" y="466" font-size="12.5" font-weight="600" fill="#633806">How PGTT was built / trained</text>
  <g font-size="11.5" fill="#5b3a0a">
    <text x="32" y="488">• Source — NtagkasAlex / phase_guided_terrain_traversal · trained with Brax + Flax PPO (JAX), phase-guided trot gait</text>
    <text x="32" y="508">• Terrain curriculum; this build loads the level17 checkpoint · weights frozen (no retraining in this repo)</text>
    <text x="32" y="528">• JAX checkpoint converted once → .npz → run as a PyTorch SiLU-MLP inside Isaac (numpy/torch only)</text>
    <text x="32" y="548">• Heightscan = ray-cast elevation (sim get_terrain_height / real elevation map) · flat walk + follow excellent, stair ascent = frozen-policy limit</text>
  </g>
</svg>
</body>
</html>
