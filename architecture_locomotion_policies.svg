<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<rect width="1400" height="700" fill="#FFFFFF"/>

<!-- Title -->
<rect width="1400" height="64" fill="#1E293B"/>
<text x="700" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Locomotion Policies</text>
<text x="700" y="54" text-anchor="middle" font-size="12" fill="#94A3B8">go2_locomotion/ · Kp=40 position drive · shared Isaac Sim + real/ros2/ · import as go2_locomotion NOT locomotion</text>

<!-- Root node -->
<rect x="450" y="76" width="500" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="700" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">go2_locomotion/</text>
<text x="700" y="118" text-anchor="middle" font-size="11" fill="#7C3AED">Shared policies · Isaac Sim + real/ros2/ ROS2 Foxy port</text>

<!-- Tree lines -->
<line x1="700" y1="128" x2="700" y2="148" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="189" y1="148" x2="1211" y2="148" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="189" y1="148" x2="189" y2="164" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="523" y1="148" x2="523" y2="164" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="857" y1="148" x2="857" y2="164" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1211" y1="148" x2="1211" y2="164" stroke="#CBD5E1" stroke-width="1.5"/>

<!-- ─── CARD 1: PGTT MLP ──────────────────────────────────── -->
<rect x="24" y="164" width="330" height="500" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<path d="M 32,164 H 346 Q 354,164 354,172 V 204 H 24 V 172 Q 24,164 32,164 Z" fill="#059669"/>
<rect x="310" y="172" width="36" height="18" rx="3" fill="rgba(255,255,255,0.2)"/>
<text x="328" y="185" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">DEFAULT</text>
<text x="175" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">PGTT MLP</text>
<text x="175" y="207" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.85">Phase-Guided Terrain Traversal</text>
<text x="38" y="234" font-size="12" font-weight="700" fill="#111827">Architecture</text>
<text x="38" y="252" font-size="11" fill="#374151">Heightmap MLP, no depth camera</text>
<line x1="30" y1="260" x2="346" y2="260" stroke="#F1F5F9" stroke-width="1"/>
<text x="38" y="278" font-size="11" fill="#9CA3AF">Obs size</text><text x="130" y="278" font-size="11" fill="#374151">153-D total</text>
<text x="38" y="296" font-size="11" fill="#9CA3AF">Heightscan</text><text x="130" y="296" font-size="11" fill="#374151">11×9 grid, 99-D</text>
<text x="38" y="314" font-size="11" fill="#9CA3AF">Phase</text><text x="130" y="314" font-size="11" fill="#374151">trot [0, π, π, 0]</text>
<text x="38" y="332" font-size="11" fill="#9CA3AF">Action scale</text><text x="130" y="332" font-size="11" fill="#374151">0.5 × residual</text>
<text x="38" y="350" font-size="11" fill="#9CA3AF">Kp / Kd</text><text x="130" y="350" font-size="11" fill="#374151">40 / 0.5</text>
<text x="38" y="368" font-size="11" fill="#9CA3AF">Stall detect</text><text x="130" y="368" font-size="11" fill="#374151">body_vx &lt; 0.06 for 0.6 s</text>
<line x1="30" y1="380" x2="346" y2="380" stroke="#F1F5F9" stroke-width="1"/>
<text x="38" y="400" font-size="11" fill="#6B7280">Flat walk:</text><text x="108" y="400" font-size="11" font-weight="600" fill="#059669">excellent</text>
<text x="38" y="418" font-size="11" fill="#6B7280">Stair climb:</text><text x="118" y="418" font-size="11" font-weight="600" fill="#DC2626">pinned at 0.15 m riser</text>
<text x="38" y="436" font-size="11" fill="#6B7280">Handoff:</text><text x="108" y="436" font-size="11" fill="#374151">stall + riser → climb</text>
<line x1="30" y1="448" x2="346" y2="448" stroke="#F1F5F9" stroke-width="1"/>
<text x="175" y="468" text-anchor="middle" font-size="10" fill="#9CA3AF">pgtt_locomotion_policy.py</text>
<text x="175" y="484" text-anchor="middle" font-size="10" fill="#9CA3AF">sim/models/locomotion/pgtt/</text>

<!-- ─── CARD 2: Parkour CNN ──────────────────────────────── -->
<rect x="368" y="164" width="330" height="500" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<path d="M 376,164 H 690 Q 698,164 698,172 V 204 H 368 V 172 Q 368,164 376,164 Z" fill="#2563EB"/>
<text x="523" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Parkour CNN</text>
<text x="523" y="207" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.85">Extreme-Parkour-Onboard Go2</text>
<text x="382" y="234" font-size="12" font-weight="700" fill="#111827">Architecture</text>
<text x="382" y="252" font-size="11" fill="#374151">Depth CNN encoder + GRU backbone</text>
<line x1="374" y1="260" x2="690" y2="260" stroke="#F1F5F9" stroke-width="1"/>
<text x="382" y="278" font-size="11" fill="#9CA3AF">Obs size</text><text x="474" y="278" font-size="11" fill="#374151">114-D total</text>
<text x="382" y="296" font-size="11" fill="#9CA3AF">Proprio</text><text x="474" y="296" font-size="11" fill="#374151">53-D (joints, vel, cmd)</text>
<text x="382" y="314" font-size="11" fill="#9CA3AF">Depth</text><text x="474" y="314" font-size="11" fill="#374151">58×87 → 32-D latent</text>
<text x="382" y="332" font-size="11" fill="#9CA3AF">GRU history</text><text x="474" y="332" font-size="11" fill="#374151">10 frames</text>
<text x="382" y="350" font-size="11" fill="#9CA3AF">Action scale</text><text x="474" y="350" font-size="11" fill="#374151">0.25 × residual</text>
<text x="382" y="368" font-size="11" fill="#9CA3AF">Kp / Kd</text><text x="474" y="368" font-size="11" fill="#374151">40 / 1.0</text>
<line x1="374" y1="380" x2="690" y2="380" stroke="#F1F5F9" stroke-width="1"/>
<text x="382" y="400" font-size="11" fill="#6B7280">Terrain:</text><text x="452" y="400" font-size="11" font-weight="600" fill="#059669">perceptive, adapts</text>
<text x="382" y="418" font-size="11" fill="#6B7280">Surge:</text><text x="442" y="418" font-size="11" font-weight="600" fill="#DC2626">person mask required</text>
<text x="382" y="436" font-size="11" fill="#6B7280">Heading:</text><text x="452" y="436" font-size="11" fill="#374151">vision (default) / command</text>
<line x1="374" y1="448" x2="690" y2="448" stroke="#F1F5F9" stroke-width="1"/>
<text x="523" y="468" text-anchor="middle" font-size="10" fill="#9CA3AF">parkour_locomotion_policy.py</text>
<text x="523" y="484" text-anchor="middle" font-size="10" fill="#9CA3AF">sim/models/locomotion/parkour/</text>

<!-- ─── CARD 3: blind-RL ──────────────────────────────────── -->
<rect x="712" y="164" width="330" height="500" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<path d="M 720,164 H 1034 Q 1042,164 1042,172 V 204 H 712 V 172 Q 712,164 720,164 Z" fill="#D97706"/>
<text x="877" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">blind-RL</text>
<text x="877" y="207" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.85">rl_sar go2_robot_lab policy</text>
<text x="726" y="234" font-size="12" font-weight="700" fill="#111827">Architecture</text>
<text x="726" y="252" font-size="11" fill="#374151">Blind MLP, proprioception only</text>
<line x1="718" y1="260" x2="1034" y2="260" stroke="#F1F5F9" stroke-width="1"/>
<text x="726" y="278" font-size="11" fill="#9CA3AF">Obs size</text><text x="818" y="278" font-size="11" fill="#374151">45-D total</text>
<text x="726" y="296" font-size="11" fill="#9CA3AF">Sensors</text><text x="818" y="296" font-size="11" fill="#374151">proprio only, no depth</text>
<text x="726" y="314" font-size="11" fill="#9CA3AF">Model</text><text x="818" y="314" font-size="11" fill="#374151">go2_robot_lab_policy.pt</text>
<text x="726" y="332" font-size="11" fill="#9CA3AF">Kp / Kd</text><text x="818" y="332" font-size="11" fill="#374151">40 / 1.0</text>
<text x="726" y="350" font-size="11" fill="#9CA3AF">Role</text><text x="818" y="350" font-size="11" fill="#374151">climb handoff backend</text>
<text x="726" y="368" font-size="11" fill="#9CA3AF">Trigger</text><text x="818" y="368" font-size="11" fill="#374151">--handoff-climb-backend blind_rl</text>
<line x1="718" y1="380" x2="1034" y2="380" stroke="#F1F5F9" stroke-width="1"/>
<text x="726" y="400" font-size="11" fill="#6B7280">Walk:</text><text x="776" y="400" font-size="11" font-weight="600" fill="#059669">PGTT handles (unchanged)</text>
<text x="726" y="418" font-size="11" fill="#6B7280">Climb:</text><text x="786" y="418" font-size="11" font-weight="600" fill="#D97706">general walker, NOT stair-trained</text>
<text x="726" y="436" font-size="11" fill="#DC2626" font-weight="600">⚠ Do NOT represent as proven climber</text>
<line x1="718" y1="448" x2="1034" y2="448" stroke="#F1F5F9" stroke-width="1"/>
<text x="877" y="468" text-anchor="middle" font-size="10" fill="#9CA3AF">sim/models/locomotion/</text>
<text x="877" y="484" text-anchor="middle" font-size="10" fill="#9CA3AF">go2_robot_lab_policy.pt</text>

<!-- ─── CARD 4: IK Climber ──────────────────────────────── -->
<rect x="1056" y="164" width="320" height="500" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<path d="M 1064,164 H 1368 Q 1376,164 1376,172 V 204 H 1056 V 172 Q 1056,164 1064,164 Z" fill="#DC2626"/>
<text x="1216" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">IK Climber</text>
<text x="1216" y="207" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.85">ClosedLoopStairClimber · deterministic</text>
<text x="1070" y="234" font-size="12" font-weight="700" fill="#111827">Architecture</text>
<text x="1070" y="252" font-size="11" fill="#374151">2-link sagittal IK + PD balance</text>
<line x1="1062" y1="260" x2="1368" y2="260" stroke="#F1F5F9" stroke-width="1"/>
<text x="1070" y="278" font-size="11" fill="#9CA3AF">Leg</text><text x="1140" y="278" font-size="11" fill="#374151">L1=L2=0.213 m sagittal</text>
<text x="1070" y="296" font-size="11" fill="#9CA3AF">IK</text><text x="1140" y="296" font-size="11" fill="#374151">2-bone per leg, per-step</text>
<text x="1070" y="314" font-size="11" fill="#9CA3AF">Balance</text><text x="1140" y="314" font-size="11" fill="#374151">FSM: lift → place → settle</text>
<text x="1070" y="332" font-size="11" fill="#9CA3AF">Riser</text><text x="1140" y="332" font-size="11" fill="#374151">0.15 m commercial preset</text>
<text x="1070" y="350" font-size="11" fill="#9CA3AF">Flag</text><text x="1140" y="350" font-size="11" fill="#374151">--closed-loop-stair-climb ON</text>
<text x="1070" y="368" font-size="11" fill="#9CA3AF">File</text><text x="1140" y="368" font-size="11" fill="#374151">closed_loop_stair_climber.py</text>
<line x1="1062" y1="380" x2="1368" y2="380" stroke="#F1F5F9" stroke-width="1"/>
<text x="1070" y="400" font-size="11" fill="#6B7280">Safety:</text><text x="1140" y="400" font-size="11" font-weight="600" fill="#059669">fails safe upright (no roll-off)</text>
<text x="1070" y="418" font-size="11" fill="#6B7280">Blocker:</text><text x="1140" y="418" font-size="11" font-weight="600" fill="#DC2626">static crawl nose-dives</text>
<text x="1070" y="436" font-size="11" fill="#6B7280">Diagnose:</text><text x="1140" y="436" font-size="11" fill="#374151">trace_climber.py + fall_diag</text>
<line x1="1062" y1="448" x2="1368" y2="448" stroke="#F1F5F9" stroke-width="1"/>
<text x="1216" y="468" text-anchor="middle" font-size="10" fill="#9CA3AF">go2_locomotion/</text>
<text x="1216" y="484" text-anchor="middle" font-size="10" fill="#9CA3AF">closed_loop_stair_climber.py</text>

