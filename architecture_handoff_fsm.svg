<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,9 4,0 8" fill="#94A3B8"/></marker>
  <marker id="arr-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,9 4,0 8" fill="#DC2626"/></marker>
  <marker id="arr-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,9 4,0 8" fill="#059669"/></marker>
</defs>
<rect width="1400" height="780" fill="#FFFFFF"/>

<!-- Title -->
<rect width="1400" height="64" fill="#1E293B"/>
<text x="700" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Policy Handoff + Climb State Machines</text>
<text x="700" y="54" text-anchor="middle" font-size="12" fill="#94A3B8">HandoffController (Isaac Sim · 50 Hz) · ClimbFSM (Docker · per-frame) · Fall Diagnostics</text>

<!-- ─── SECTION A: HandoffController ──────────────────────── -->
<rect x="20" y="72" width="1360" height="28" rx="5" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
<rect x="20" y="72" width="4" height="28" rx="2" fill="#D97706"/>
<text x="44" y="91" font-size="12" font-weight="700" fill="#92400E">HandoffController</text>
<text x="188" y="91" font-size="11" fill="#78350F">pgtt_stair_handoff.py · runs inside Isaac physics loop at 50 Hz · selects active policy each step</text>

<!-- State: WALK -->
<rect x="20" y="110" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
<rect x="20" y="110" width="280" height="5" rx="8" fill="#059669"/>
<rect x="20" y="113" width="280" height="2" fill="#059669"/>
<text x="160" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">WALK</text>
<text x="160" y="154" text-anchor="middle" font-size="11" fill="#059669">PGTT or Parkour active</text>
<line x1="28" y1="162" x2="292" y2="162" stroke="#F1F5F9" stroke-width="1"/>
<text x="36" y="180" font-size="11" fill="#9CA3AF">Stall monitor</text>
<text x="36" y="196" font-size="11" fill="#374151">body_vx &lt; 0.06 m/s, cmd &gt; 0.05</text>
<text x="36" y="212" font-size="11" fill="#374151">sustained 0.6 s + progress &lt; 0.04 m</text>
<text x="36" y="228" font-size="11" fill="#9CA3AF">Riser gate</text>
<text x="36" y="244" font-size="11" fill="#374151">≥ 2 risers at &lt; 1.6 m range</text>
<text x="36" y="260" font-size="11" fill="#6B7280" font-style="italic">start state</text>
<text x="36" y="302" font-size="11" fill="#059669">→ CLIMB on all conditions met</text>

<!-- Arrow WALK → CLIMB -->
<line x1="300" y1="210" x2="380" y2="210" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
<text x="340" y="202" text-anchor="middle" font-size="10" fill="#64748B">stall+riser</text>

<!-- State: CLIMB -->
<rect x="380" y="110" width="320" height="200" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<rect x="380" y="110" width="320" height="5" rx="8" fill="#D97706"/>
<rect x="380" y="113" width="320" height="2" fill="#D97706"/>
<text x="540" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">CLIMB</text>
<text x="540" y="154" text-anchor="middle" font-size="11" fill="#D97706">blind-RL · Parkour · IK backend</text>
<line x1="388" y1="162" x2="692" y2="162" stroke="#F1F5F9" stroke-width="1"/>
<text x="396" y="180" font-size="11" fill="#9CA3AF">Handoff dist</text><text x="490" y="180" font-size="11" fill="#374151">0.90 m</text>
<text x="396" y="196" font-size="11" fill="#9CA3AF">Abort tilt</text><text x="490" y="196" font-size="11" fill="#374151">0.70 rad</text>
<text x="396" y="212" font-size="11" fill="#9CA3AF">Timeout</text><text x="490" y="212" font-size="11" fill="#374151">8.0 s</text>
<text x="396" y="228" font-size="11" fill="#9CA3AF">Person gate</text><text x="490" y="228" font-size="11" fill="#374151">vx_floor=0 when patient close</text>
<text x="396" y="244" font-size="11" fill="#9CA3AF">heading</text><text x="490" y="244" font-size="11" fill="#374151">yaw → 0 + recenter on ramp</text>
<text x="396" y="260" font-size="11" fill="#374151">stairs_action_active = true</text>
<text x="396" y="302" font-size="11" fill="#D97706">→ TOP_EGRESS on crest clear</text>

<!-- Abort arrow down from CLIMB -->
<line x1="540" y1="310" x2="540" y2="356" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
<rect x="390" y="358" width="300" height="44" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
<text x="540" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">ABORT → back to WALK</text>
<text x="540" y="394" text-anchor="middle" font-size="11" fill="#EF4444">timeout · tilt &gt; 0.70 rad</text>

<!-- Arrow CLIMB → TOP EGRESS -->
<line x1="700" y1="210" x2="780" y2="210" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
<text x="740" y="202" text-anchor="middle" font-size="10" fill="#64748B">crest clear</text>

<!-- State: TOP EGRESS -->
<rect x="780" y="110" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<rect x="780" y="110" width="280" height="5" rx="8" fill="#7C3AED"/>
<rect x="780" y="113" width="280" height="2" fill="#7C3AED"/>
<text x="920" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">TOP EGRESS</text>
<text x="920" y="154" text-anchor="middle" font-size="11" fill="#7C3AED">walk clear of crest</text>
<line x1="788" y1="162" x2="1052" y2="162" stroke="#F1F5F9" stroke-width="1"/>
<text x="796" y="180" font-size="11" fill="#9CA3AF">Trigger</text><text x="862" y="180" font-size="11" fill="#374151">depth-clear AND GT-terrain-clear</text>
<text x="796" y="196" font-size="11" fill="#9CA3AF">Check</text><text x="862" y="196" font-size="11" fill="#374151">relative-rise stairs_ahead_gt</text>
<text x="796" y="212" font-size="11" fill="#9CA3AF">Action</text><text x="862" y="212" font-size="11" fill="#374151">walk top_egress_distance_m fwd</text>
<text x="796" y="228" font-size="11" fill="#9CA3AF">Flag</text><text x="862" y="228" font-size="11" fill="#374151">--no-handoff-top-egress to skip</text>
<text x="796" y="244" font-size="11" fill="#9CA3AF">Debounce</text><text x="862" y="244" font-size="11" fill="#374151">3-frame smoothed</text>
<text x="796" y="302" font-size="11" fill="#7C3AED">→ WALK (resumed) on egress done</text>

<!-- Arrow TOP EGRESS → WALK resumed (dashed loop) -->
<line x1="1060" y1="210" x2="1140" y2="210" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

<!-- State: WALK resumed (dashed) -->
<rect x="1100" y="110" width="260" height="200" rx="8" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="1230" y="137" text-anchor="middle" font-size="15" font-weight="600" fill="#64748B">WALK (resumed)</text>
<text x="1230" y="154" text-anchor="middle" font-size="11" fill="#94A3B8">PGTT / Parkour continues</text>
<line x1="1108" y1="162" x2="1352" y2="162" stroke="#F1F5F9" stroke-width="1"/>
<text x="1116" y="180" font-size="11" fill="#9CA3AF">Stall</text><text x="1168" y="180" font-size="11" fill="#94A3B8">detector resets</text>
<text x="1116" y="196" font-size="11" fill="#9CA3AF">Follow</text><text x="1168" y="196" font-size="11" fill="#94A3B8">person-follow continues</text>
<text x="1116" y="212" font-size="11" fill="#9CA3AF">Repeat</text><text x="1168" y="212" font-size="11" fill="#94A3B8">can re-trigger stall → CLIMB</text>

<!-- Key thresholds box -->
<rect x="1100" y="320" width="260" height="96" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
<text x="1230" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Key Thresholds</text>
<line x1="1108" y1="345" x2="1352" y2="345" stroke="#FDE68A" stroke-width="1"/>
<text x="1116" y="362" font-size="11" fill="#9CA3AF">stall_speed</text><text x="1210" y="362" font-size="11" fill="#374151">0.06 m/s</text>
<text x="1116" y="378" font-size="11" fill="#9CA3AF">stall_consec</text><text x="1210" y="378" font-size="11" fill="#374151">0.6 s</text>
<text x="1116" y="394" font-size="11" fill="#9CA3AF">min_riser</text><text x="1210" y="394" font-size="11" fill="#374151">0.08 m · count ≥ 2</text>
<text x="1116" y="410" font-size="11" fill="#9CA3AF">max_range</text><text x="1210" y="410" font-size="11" fill="#374151">1.6 m</text>

<!-- ─── SECTION B: ClimbFSM ─────────────────────────────── -->
<rect x="20" y="428" width="1360" height="28" rx="5" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
<rect x="20" y="428" width="4" height="28" rx="2" fill="#059669"/>
<text x="44" y="447" font-size="12" font-weight="700" fill="#065F46">ClimbFSM</text>
<text x="148" y="447" font-size="11" fill="#166534">core/control/follow_shaping.py · Docker controller · drives vx/wz/yaw_err per perception frame</text>

<!-- 6 FSM states in a row -->
<!-- FLAT_FOLLOW -->
<rect x="20" y="468" width="210" height="196" rx="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="20" y="468" width="210" height="4" rx="7" fill="#059669"/>
<rect x="20" y="470" width="210" height="2" fill="#059669"/>
<text x="125" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">FLAT_FOLLOW</text>
<text x="125" y="505" text-anchor="middle" font-size="10" fill="#059669">start state</text>
<line x1="26" y1="512" x2="222" y2="512" stroke="#F1F5F9" stroke-width="1"/>
<text x="30" y="528" font-size="10" fill="#6B7280">Normal PID follow</text>
<text x="30" y="544" font-size="10" fill="#6B7280">person visible + tracked</text>
<line x1="26" y1="552" x2="222" y2="552" stroke="#F1F5F9" stroke-width="1"/>
<text x="30" y="568" font-size="10" fill="#9CA3AF">→ STAIR_APPROACH:</text>
<text x="30" y="582" font-size="10" fill="#374151">  stairs_detected = true</text>
<text x="30" y="598" font-size="10" fill="#9CA3AF">→ LOSS_GLIDE:</text>
<text x="30" y="612" font-size="10" fill="#374151">  person lost</text>
<text x="30" y="652" font-size="10" fill="#9CA3AF">→ STOP: timeout</text>

<!-- Arrow right -->
<line x1="230" y1="566" x2="248" y2="566" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- STAIR_APPROACH -->
<rect x="248" y="468" width="210" height="196" rx="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="248" y="468" width="210" height="4" rx="7" fill="#D97706"/>
<rect x="248" y="470" width="210" height="2" fill="#D97706"/>
<text x="353" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">STAIR_APPROACH</text>
<text x="353" y="505" text-anchor="middle" font-size="10" fill="#D97706">stairs visible</text>
<line x1="254" y1="512" x2="450" y2="512" stroke="#F1F5F9" stroke-width="1"/>
<text x="258" y="528" font-size="10" fill="#6B7280">Heading + speed hold</text>
<text x="258" y="544" font-size="10" fill="#6B7280">creep to riser (commit)</text>
<line x1="254" y1="552" x2="450" y2="552" stroke="#F1F5F9" stroke-width="1"/>
<text x="258" y="568" font-size="10" fill="#9CA3AF">→ STAIR_NEAR:</text>
<text x="258" y="582" font-size="10" fill="#374151">  range close</text>
<text x="258" y="598" font-size="10" fill="#9CA3AF">→ FLAT_FOLLOW:</text>
<text x="258" y="612" font-size="10" fill="#374151">  stairs lost</text>

<!-- Arrow right -->
<line x1="458" y1="566" x2="476" y2="566" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- STAIR_NEAR -->
<rect x="476" y="468" width="210" height="196" rx="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="476" y="468" width="210" height="4" rx="7" fill="#D97706"/>
<rect x="476" y="470" width="210" height="2" fill="#D97706"/>
<text x="581" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">STAIR_NEAR</text>
<text x="581" y="505" text-anchor="middle" font-size="10" fill="#D97706">stair base reached</text>
<line x1="482" y1="512" x2="678" y2="512" stroke="#F1F5F9" stroke-width="1"/>
<text x="486" y="528" font-size="10" fill="#6B7280">Square-up + vx floor</text>
<text x="486" y="544" font-size="10" fill="#6B7280">obstacle gate bypassed</text>
<line x1="482" y1="552" x2="678" y2="552" stroke="#F1F5F9" stroke-width="1"/>
<text x="486" y="568" font-size="10" fill="#9CA3AF">→ COMMITTED:</text>
<text x="486" y="582" font-size="10" fill="#374151">  HandoffCtrl active</text>
<text x="486" y="598" font-size="10" fill="#9CA3AF">→ LOSS_FLOOR:</text>
<text x="486" y="612" font-size="10" fill="#374151">  stairs gone</text>

<!-- Arrow right -->
<line x1="686" y1="566" x2="704" y2="566" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- COMMITTED_CLIMB -->
<rect x="704" y="468" width="210" height="196" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
<rect x="704" y="468" width="210" height="4" rx="7" fill="#DC2626"/>
<rect x="704" y="470" width="210" height="2" fill="#DC2626"/>
<text x="809" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">COMMITTED_CLIMB</text>
<text x="809" y="505" text-anchor="middle" font-size="10" fill="#DC2626">active climb</text>
<line x1="710" y1="512" x2="906" y2="512" stroke="#FECACA" stroke-width="1"/>
<text x="714" y="528" font-size="10" fill="#6B7280">stairs_action_active=true</text>
<text x="714" y="544" font-size="10" fill="#6B7280">heading-lock yaw → 0</text>
<line x1="710" y1="552" x2="906" y2="552" stroke="#FECACA" stroke-width="1"/>
<text x="714" y="568" font-size="10" fill="#9CA3AF">→ LOSS_FLOOR:</text>
<text x="714" y="582" font-size="10" fill="#374151">  stairs gone mid-climb</text>
<text x="714" y="598" font-size="10" fill="#9CA3AF">→ FLAT_FOLLOW:</text>
<text x="714" y="612" font-size="10" fill="#374151">  climb complete</text>

<!-- Arrow right -->
<line x1="914" y1="566" x2="932" y2="566" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- STAIR_LOSS_FLOOR -->
<rect x="932" y="468" width="210" height="196" rx="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="932" y="468" width="210" height="4" rx="7" fill="#D97706"/>
<rect x="932" y="470" width="210" height="2" fill="#D97706"/>
<text x="1037" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">STAIR_LOSS_FLOOR</text>
<text x="1037" y="505" text-anchor="middle" font-size="10" fill="#D97706">stairs lost mid-climb</text>
<line x1="938" y1="512" x2="1134" y2="512" stroke="#F1F5F9" stroke-width="1"/>
<text x="942" y="528" font-size="10" fill="#6B7280">Hold last bearing + gap</text>
<text x="942" y="544" font-size="10" fill="#6B7280">predict 3.0 s window</text>
<line x1="938" y1="552" x2="1134" y2="552" stroke="#F1F5F9" stroke-width="1"/>
<text x="942" y="568" font-size="10" fill="#9CA3AF">→ COMMITTED: seen</text>
<text x="942" y="582" font-size="10" fill="#9CA3AF">→ STOP: timeout</text>

<!-- STOP state -->
<rect x="1160" y="468" width="220" height="196" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="1270" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">STOP</text>
<text x="1270" y="505" text-anchor="middle" font-size="10" fill="#DC2626">cmd = 0 all axes</text>
<line x1="1166" y1="512" x2="1372" y2="512" stroke="#FECACA" stroke-width="1"/>
<text x="1170" y="528" font-size="10" fill="#6B7280">Wait for reacquire</text>
<text x="1170" y="544" font-size="10" fill="#6B7280">or operator override</text>
<line x1="1166" y1="552" x2="1372" y2="552" stroke="#FECACA" stroke-width="1"/>
<text x="1170" y="568" font-size="10" fill="#9CA3AF">→ FLAT_FOLLOW:</text>
<text x="1170" y="582" font-size="10" fill="#374151">  person seen again</text>

<line x1="1142" y1="566" x2="1160" y2="566" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ─── Fall Diagnostics ──────────────────── -->
<rect x="20" y="680" width="440" height="82" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="20" y="680" width="4" height="82" rx="2" fill="#DC2626"/>
<text x="36" y="700" font-size="12" font-weight="700" fill="#991B1B">Fall Detection</text>
<text x="36" y="716" font-size="11" fill="#9CA3AF">flipped</text><text x="100" y="716" font-size="11" fill="#374151">tilt &gt; 1.05 rad</text>
<text x="36" y="732" font-size="11" fill="#9CA3AF">collapsed</text><text x="100" y="732" font-size="11" fill="#374151">height &lt; 0.18 m AND tilt &gt; 0.52 rad</text>
<text x="36" y="748" font-size="11" fill="#6B7280">ROBOT_COLLAPSE_TILT_RAD=0.52 guards upright-wedge false-fall</text>

<rect x="480" y="680" width="440" height="82" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="480" y="680" width="4" height="82" rx="2" fill="#D97706"/>
<text x="496" y="700" font-size="12" font-weight="700" fill="#92400E">Climb Verdict  (analyze_climb)</text>
<text x="496" y="716" font-size="11" fill="#9CA3AF">FELL</text><text x="560" y="716" font-size="11" fill="#374151">sustained fall detected</text>
<text x="496" y="732" font-size="11" fill="#9CA3AF">COLLIDED</text><text x="560" y="732" font-size="11" fill="#374151">contact without forward progress</text>
<text x="496" y="748" font-size="11" fill="#059669">CLEAN CLIMB</text><text x="596" y="748" font-size="11" fill="#374151">sustained upright progress</text>

<rect x="940" y="680" width="440" height="82" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="940" y="680" width="4" height="82" rx="2" fill="#64748B"/>
<text x="956" y="700" font-size="12" font-weight="700" fill="#374151">Authoritative Source</text>
<text x="956" y="716" font-size="11" fill="#374151">debug/isaac_env.jsonl · per-step JSONL stream</text>
<text x="956" y="732" font-size="11" fill="#DC2626">⚠ Do NOT use evaluation_summary.txt or max_x alone</text>
<text x="956" y="748" font-size="11" fill="#9CA3AF">perf_tracker archive.jsonl = full history</text>
</svg>
