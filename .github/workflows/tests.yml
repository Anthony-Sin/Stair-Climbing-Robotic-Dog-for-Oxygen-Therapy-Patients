name: tests

# Minimal CI: run the host-safe pytest suite on every push/PR so a collection break
# (e.g. an import to a deleted module) can never again sit green-but-unrun in the tree.
# The suite is host-safe by design — no torch / rclpy / pyrealsense2 / Isaac needed.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # matches the dev host

      - name: Install host-safe test deps
        run: |
          python -m pip install --upgrade pip
          # The [test] extra in pyproject.toml is the single source of truth for the
          # host-safe deps (no torch/rclpy/pyrealsense2/isaac). Editable install also puts
          # the src/ import root on sys.path.
          pip install -e ".[test]"
          # Coverage tooling is not in the [test] extra (can't edit pyproject here); install
          # it in the workflow so the suite runs under coverage and 0%-of-main.py is VISIBLE.
          pip install pytest-cov

      - name: Run test suite under coverage
        # --cov reads .coveragerc (source=src, omits sim/real/tests). No threshold/gate:
        # the point is to MAKE COVERAGE VISIBLE, not to fail the build on it yet.
        run: |
          python -m pytest -q \
            --cov --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Print coverage summary
        if: always()
        run: |
          python -m coverage report --rcfile=.coveragerc || true

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
