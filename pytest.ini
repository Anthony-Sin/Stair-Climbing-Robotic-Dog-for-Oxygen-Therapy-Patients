[pytest]
# Bare `pytest` from the repo root runs the host-safe suite. Isaac/GPU-dependent
# test files are skipped from collection by tests/conftest.py when their runtimes
# are absent (see tests/README.md).
testpaths = tests

markers =
    requires_isaac: needs Isaac Sim (omni / pxr); skipped on host
    requires_gpu: needs a CUDA GPU + model weights
    requires_docker: needs the robot runtime Docker container
    requires_network: needs network access (remote USD/CDN assets)
