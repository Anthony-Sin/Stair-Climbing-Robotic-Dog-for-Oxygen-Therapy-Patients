# ROS 2 parameters for the real Go2 EDU control stack (Foxy).
# Loaded by the launch via `--ros-args --params-file`. Node-name keys must match the
# node names (super().__init__("<name>")). Paths are repo-relative; the robot copies
# the weights under real/models/ and points these there.

sport_startup:
  ros__parameters:
    network_interface: eth0      # the wired iface unitree_ros2 / the SDK talk on
    release_on_start: true
    sdk_timeout_sec: 10.0

low_level_control:
  ros__parameters:
    lowstate_topic: /lowstate
    lowcmd_topic: /lowcmd
    sport_state_topic: /go2/sport_state
    heightscan_topic: /go2/heightscan
    stair_topic: /go2/stair_detection
    control_hz: 50.0
    require_sport_released: true
    cmd_timeout_sec: 0.4         # follow command older than this -> HOLD (zero vel, balance)
    cmd_damp_sec: 1.0            # follow command older than this -> DAMP (safe-stop)
    climb_backend: blind_rl
    # Weights. Resolved CWD-relative by the node; the launch/run_real.sh CWD is the repo
    # root (/workspace), where the current weights live under src/sim/models/ (post src/
    # refactor). The pre-refactor "sim/models/..." paths pointed at nonexistent files, so
    # preflight passed (it was handed DIFFERENT absolute paths) while the control node died
    # on FileNotFoundError -- robot folded with nothing driving. These now point at the real
    # current files. (On the robot you may copy them under real/models/ and repoint here.)
    pgtt_policy_path: src/sim/models/pgtt/pgtt_go2_level17.npz
    rl_policy_path: src/sim/models/locomotion/go2_robot_lab_policy.pt
    walk_kp: 40.0                # PGTT position drive (verified contract)
    walk_kd: 0.5
    climb_kp: 20.0               # blind_rl motor-PD (verified contract)
    climb_kd: 0.5
    record_telemetry: true       # flight recorder ON by default; empty dir auto-derives run_logs/real/<ts>
    telemetry_dir: ""

lidar_heightscan:
  ros__parameters:
    # Only used in heightscan_mode: lidar. SKU selects the extrinsic (Mid-360 vs XT16).
    lidar_topic: /livox/lidar    # Mid-360 driver; Hesai XT16 -> /hesai/pandar
    lidar_sku: mid360            # or "xt16"
    heightscan_mode: flat        # "flat" (bring-up, safe) or "lidar" (HIL-validated)
    heightscan_scale: 1.0        # 1.5 was real-robot-only in sim notes
