<!-- Bottom warning strip -->
<rect x="20" y="632" width="1360" height="52" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
<rect x="20" y="632" width="4" height="52" fill="#D97706"/>
<text x="44" y="653" font-size="11" font-weight="700" fill="#92400E">Key Gotchas</text>
<text x="44" y="669" font-size="11" fill="#78350F">--stair-preset must be passed explicitly or silently uses demo_gentle (0.08 m OOD)  ·  command.json UTF-8 no-BOM (PS 5.1 bug)  ·  judge from log/launcher.log not exit code</text>
<text x="44" y="684" font-size="11" fill="#78350F">never import isaac_env by name (re-executes __main__)  ·  use getLogger("isaac_env")  ·  do NOT call SimulationManager.set_backend("torch") — breaks classic World pipeline</text>
