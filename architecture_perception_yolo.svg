<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#94A3B8"/></marker>
</defs>
<rect width="1200" height="760" fill="#FFFFFF"/>

<!-- Title -->
<rect width="1200" height="64" fill="#1E293B"/>
<text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Perception Pipeline</text>
<text x="600" y="54" text-anchor="middle" font-size="12" fill="#94A3B8">D435 RealSense · YOLOv8-Pose · YOLO-World · DepthProcessor · LiDAR Fusion · Person Mask · PersonFollower</text>

<!-- ── SOURCE: D435 ──────────────────────── -->
<rect x="380" y="76" width="440" height="56" rx="8" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2"/>
<text x="600" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#0369A1">Intel D435 RealSense Camera</text>
<text x="600" y="120" text-anchor="middle" font-size="11" fill="#0284C7">FRONT_D435_MOUNT (0.24, 0, 0.12) m · RGB + Depth co-located · UDP 55002 → Docker</text>

<!-- Split lines -->
<line x1="600" y1="132" x2="600" y2="150" stroke="#CBD5E1" stroke-width="1.5"/>
<circle cx="600" cy="150" r="4" fill="#94A3B8"/>
<line x1="240" y1="150" x2="598" y2="150" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="600" y1="150" x2="960" y2="150" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="240" y1="150" x2="240" y2="166" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="960" y1="150" x2="960" y2="166" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ── LEFT COLUMN: RGB Processing ─────── -->
<rect x="30" y="166" width="420" height="36" rx="6" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
<text x="240" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">RGB Stream  1280 × 720  ·  69°H × 42.6°V</text>

<!-- YOLOv8-Pose TRT -->
<line x1="240" y1="202" x2="240" y2="216" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="30" y="216" width="420" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="30" y="216" width="4" height="80" rx="2" fill="#7C3AED"/>
<text x="50" y="237" font-size="13" font-weight="700" fill="#111827">YOLOv8-Pose TRT</text>
<text x="50" y="253" font-size="11" fill="#6B7280">person bboxes + 17 COCO keypoints · NMS</text>
<line x1="34" y1="261" x2="442" y2="261" stroke="#F1F5F9" stroke-width="1"/>
<text x="50" y="278" font-size="11" fill="#9CA3AF">Input</text><text x="110" y="278" font-size="11" fill="#374151">RGB 1280×720 · TRT engine on Jetson</text>
<text x="50" y="292" font-size="11" fill="#9CA3AF">Output</text><text x="110" y="292" font-size="11" fill="#374151">bboxes[4] · score · keypoints[17×3]</text>

<!-- SinglePersonTracker -->
<line x1="240" y1="296" x2="240" y2="310" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="30" y="310" width="420" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="30" y="310" width="4" height="80" rx="2" fill="#7C3AED"/>
<text x="50" y="331" font-size="13" font-weight="700" fill="#111827">SinglePersonTracker</text>
<text x="50" y="347" font-size="11" fill="#6B7280">IoU re-ID · consistent track_id across frames</text>
<line x1="34" y1="355" x2="442" y2="355" stroke="#F1F5F9" stroke-width="1"/>
<text x="50" y="372" font-size="11" fill="#9CA3AF">Re-ID</text><text x="110" y="372" font-size="11" fill="#374151">IoU overlap matching per frame</text>
<text x="50" y="386" font-size="11" fill="#9CA3AF">Lost</text><text x="110" y="386" font-size="11" fill="#374151">predict position up to 3.0 s</text>

<!-- YOLO-World Stairs -->
<line x1="240" y1="390" x2="240" y2="404" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="30" y="404" width="420" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="30" y="404" width="4" height="80" rx="2" fill="#7C3AED"/>
<text x="50" y="425" font-size="13" font-weight="700" fill="#111827">YOLO-World Stairs TRT</text>
<text x="50" y="441" font-size="11" fill="#6B7280">open-vocab · riser count · confidence gate</text>
<line x1="34" y1="449" x2="442" y2="449" stroke="#F1F5F9" stroke-width="1"/>
<text x="50" y="466" font-size="11" fill="#9CA3AF">Output</text><text x="110" y="466" font-size="11" fill="#374151">bbox · confidence · riser_count</text>
<text x="50" y="480" font-size="11" fill="#9CA3AF">Gate</text><text x="110" y="480" font-size="11" fill="#374151">≥ 2 risers at &lt; 1.6 m → stairs_detected</text>

<!-- ── RIGHT COLUMN: Depth Processing ──── -->
<rect x="750" y="166" width="420" height="36" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
<text x="960" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">Depth Stream  58 × 87  ·  float32  ·  0–2 m</text>

<!-- DepthProcessor -->
<line x1="960" y1="202" x2="960" y2="216" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="750" y="216" width="420" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="750" y="216" width="4" height="80" rx="2" fill="#059669"/>
<text x="770" y="237" font-size="13" font-weight="700" fill="#111827">DepthProcessor</text>
<text x="770" y="253" font-size="11" fill="#6B7280">person gap estimation from raw depth</text>
<line x1="754" y1="261" x2="1162" y2="261" stroke="#F1F5F9" stroke-width="1"/>
<text x="770" y="278" font-size="11" fill="#9CA3AF">Method</text><text x="840" y="278" font-size="11" fill="#374151">foreground bimodal histogram</text>
<text x="770" y="292" font-size="11" fill="#9CA3AF">Output</text><text x="840" y="292" font-size="11" fill="#374151">person_dist_m · gap_m</text>

<!-- LiDAR Fusion -->
<line x1="960" y1="296" x2="960" y2="310" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="750" y="310" width="420" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="750" y="310" width="4" height="80" rx="2" fill="#059669"/>
<text x="770" y="331" font-size="13" font-weight="700" fill="#111827">LiDAR Fusion</text>
<text x="770" y="347" font-size="11" fill="#6B7280">fuse camera + LiDAR depth estimates</text>
<line x1="754" y1="355" x2="1162" y2="355" stroke="#F1F5F9" stroke-width="1"/>
<text x="770" y="372" font-size="11" fill="#9CA3AF">Method</text><text x="840" y="372" font-size="11" fill="#374151">fuse_distance() · lidar_weight=0.6</text>
<text x="770" y="386" font-size="11" fill="#9CA3AF">Output</text><text x="840" y="386" font-size="11" fill="#374151">fused gap_m → PersonFollower</text>

<!-- Person Depth Mask -->
<line x1="960" y1="390" x2="960" y2="404" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="750" y="404" width="420" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="750" y="404" width="4" height="80" rx="2" fill="#059669"/>
<text x="770" y="425" font-size="13" font-weight="700" fill="#111827">Person Depth Mask</text>
<text x="770" y="441" font-size="11" fill="#6B7280">mask_person_in_parkour_depth() · prevents surge</text>
<line x1="754" y1="449" x2="1162" y2="449" stroke="#F1F5F9" stroke-width="1"/>
<text x="770" y="466" font-size="11" fill="#9CA3AF">Method</text><text x="840" y="466" font-size="11" fill="#374151">bbox → fill region with terrain depth</text>
<text x="770" y="480" font-size="11" fill="#9CA3AF">Output</text><text x="840" y="480" font-size="11" fill="#374151">clean 58×87 depth → Parkour CNN</text>

<!-- ── CONVERGENCE ROW ─────────────────── -->
<line x1="240" y1="484" x2="240" y2="540" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="960" y1="484" x2="960" y2="540" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="240" y1="540" x2="440" y2="540" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="960" y1="540" x2="760" y2="540" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- PersonFollower -->
<rect x="30" y="546" width="400" height="80" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
<text x="230" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">PersonFollower</text>
<text x="230" y="583" text-anchor="middle" font-size="11" fill="#059669">3-zone PID · target 0.45 m · kp=0.8</text>
<line x1="34" y1="591" x2="422" y2="591" stroke="#F1F5F9" stroke-width="1"/>
<text x="50" y="607" font-size="11" fill="#9CA3AF">Zones</text><text x="110" y="607" font-size="11" fill="#374151">far → cruise · at-target → hold · close → brake</text>
<text x="50" y="621" font-size="11" fill="#9CA3AF">Bearing</text><text x="110" y="621" font-size="11" fill="#374151">heading PID from YOLO bbox center</text>

<!-- ClimbFSM -->
<rect x="450" y="546" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<text x="600" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">ClimbFSM</text>
<text x="600" y="583" text-anchor="middle" font-size="11" fill="#D97706">6-state · follow_shaping.py</text>
<line x1="454" y1="591" x2="746" y2="591" stroke="#F1F5F9" stroke-width="1"/>
<text x="466" y="607" font-size="11" fill="#9CA3AF">Trigger</text><text x="530" y="607" font-size="11" fill="#374151">stairs_detected → STAIR_APPROACH</text>
<text x="466" y="621" font-size="11" fill="#9CA3AF">Climb</text><text x="530" y="621" font-size="11" fill="#374151">stairs_action_active bypasses gate</text>

<!-- Parkour obs -->
<rect x="770" y="546" width="400" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="970" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Policy Obs  114-D</text>
<text x="970" y="583" text-anchor="middle" font-size="11" fill="#2563EB">Parkour CNN input vector</text>
<line x1="774" y1="591" x2="1162" y2="591" stroke="#F1F5F9" stroke-width="1"/>
<text x="786" y="607" font-size="11" fill="#9CA3AF">Depth</text><text x="844" y="607" font-size="11" fill="#374151">32-D latent (from 58×87 masked)</text>
<text x="786" y="621" font-size="11" fill="#9CA3AF">Proprio</text><text x="844" y="621" font-size="11" fill="#374151">53-D + 3-D cmd vector</text>

<!-- ── UDP OUTPUT ─────────────────────── -->
<line x1="230" y1="626" x2="230" y2="672" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="230" y1="672" x2="500" y2="672" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="200" y="682" width="800" height="52" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
<text x="600" y="706" text-anchor="middle" font-size="14" font-weight="700" fill="#14532D">UDP 55001 → Isaac Sim</text>
<text x="600" y="724" text-anchor="middle" font-size="11" fill="#15803D">vx · vy · wz · yaw_err · stairs_detected · gap_m · person_bbox[4] · hold · stairs_action_active</text>
</svg>
